# 확정 목업만 GitHub Pages로 배포한다 (docs/mockup-pages.md).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/archive/mockup/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: 배포 폴더 만들기 (목업만 index.html로)
        run: |
          mkdir _site
          cp docs/archive/mockup/saveme-mvp.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
