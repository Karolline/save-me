<title>SaveMe MVP 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 목업 바(어두운 띠) + 기기 프레임. 프레임 안이 실제 앱이고, 앱은 MVP 기준 라이트 테마 하나로 고정한다 (다크는 2단계). */
:root {
  --bg: #F5F6F9;
  --surface: #FFFFFF;
  --line: #E2E5EC;
  --grid: #EEF0F4;
  --fg: #1B2130;
  --muted: #687184;
  --faint: #9AA1B0;
  --accent: #2B3F7C;
  --accent-weak: #EDF0F8;
  --d1: #C8D4EC; --d2: #8EA6D6; --d3: #4E70B8; --d4: #233F7E;
  --fail: #C2453B; --closed: #A27627; --none: #878D99; --ing: #2C8452;
  --mine: #EEF3FC; --mine-line: #C9D7F2;
  --retry: #EAF6EF; --retry-line: #BFE1CC;
  --memo: #FBF5E6; --memo-line: #EBDDB5;
  --kakao: #FEE500;
  --chrome: #1A1F2B; --chrome-2: #262C3A; --chrome-fg: #E7EAF1; --chrome-muted: #9BA3B4;
  --stage: #D9DDE5;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--stage); color: var(--fg); font-family: var(--font); font-size: 14px; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.page { height: 100%; display: flex; flex-direction: column; }

/* ── 목업 바 ── */
.mbar { background: var(--chrome); color: var(--chrome-fg); padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
.mbar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.mbar-title { font-weight: 600; font-size: 13px; letter-spacing: .02em; }
.mbar-title small { color: var(--chrome-muted); font-weight: 400; margin-left: 6px; }
.mbar label { color: var(--chrome-muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.mbar select { background: var(--chrome-2); border: 1px solid #3A4152; border-radius: 6px; padding: 5px 8px; color: var(--chrome-fg); font-size: 13px; max-width: 280px; }
.mseg { display: inline-flex; background: var(--chrome-2); border-radius: 6px; padding: 2px; }
.mseg button { background: none; border: 0; padding: 4px 10px; border-radius: 5px; font-size: 12px; color: var(--chrome-muted); }
.mseg button[aria-pressed="true"] { background: #3D4558; color: #fff; }
.mbtn { background: none; border: 1px solid #3A4152; color: var(--chrome-fg); border-radius: 6px; padding: 4px 10px; font-size: 12px; }
.mnote { font-size: 12px; color: var(--chrome-muted); line-height: 1.5; }
.mnote b { color: var(--chrome-fg); font-weight: 500; }
.mnote code { font-family: var(--mono); font-size: 11px; background: var(--chrome-2); padding: 1px 5px; border-radius: 4px; color: var(--chrome-fg); }

.stage { flex: 1; min-height: 0; display: flex; justify-content: center; padding: 16px; }
.frame { container-type: inline-size; container-name: app; width: 100%; max-width: 1360px; height: 100%; background: var(--bg); border-radius: 8px; overflow: hidden; position: relative; transform: translateZ(0); box-shadow: 0 1px 3px rgba(20,28,45,.12); }
.frame.mobile { max-width: 390px; border-radius: 22px; border: 6px solid var(--chrome); }
@media (max-width: 600px) { .stage { padding: 0; } .frame, .frame.mobile { border-radius: 0; border: 0; max-width: none; } }

.app { height: 100%; overflow: auto; background: var(--bg); }

/* ── 공통 부품 ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #22336A; }
.btn-primary:disabled, .btn-danger:disabled { background: #B9C0CF; border-color: #B9C0CF; cursor: not-allowed; }
.btn-danger { background: var(--fail); border-color: var(--fail); color: #fff; }
.btn-text { background: none; border: 0; padding: 0 4px; height: auto; color: var(--muted); }
.btn-text.danger { color: var(--fail); }
.btn-sm { height: 30px; padding: 0 10px; font-size: 13px; }
.icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent; background: none; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.icon-btn:hover { background: var(--bg); border-color: var(--line); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 2px; }
.seg button { border: 0; background: none; height: 30px; padding: 0 12px; border-radius: 6px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent); }
.seg .n { font-family: var(--mono); font-size: 12px; margin-left: 4px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 500; }
.field > span em { color: var(--fail); font-style: normal; margin-left: 2px; }
.input, .select, .textarea { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px 10px; font-size: 16px; }
.input, .select { height: 40px; }
.textarea { resize: vertical; line-height: 1.6; min-height: 120px; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
.input.invalid { border-color: var(--fail); }
.hint-err { color: var(--fail); font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--bg); color: var(--muted); white-space: nowrap; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ── 단독 화면 (로그인, 가입, 문서) ── */
.solo { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
.solo-card { width: 100%; max-width: 400px; padding: 36px 32px; display: flex; flex-direction: column; gap: 20px; }
.brand { font-weight: 700; font-size: 26px; letter-spacing: -.01em; color: var(--accent); }
.brand-sm { font-weight: 700; font-size: 18px; color: var(--accent); letter-spacing: -.01em; }
.kakao-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--kakao); color: rgba(0,0,0,.85); font-weight: 600; font-size: 15px; }
.kakao-btn svg { width: 20px; height: 20px; }
.fine { font-size: 12px; color: var(--muted); line-height: 1.6; }
.fine a, .link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; background: none; border: 0; padding: 0; font-size: inherit; }
.steps { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.steps b { font-family: var(--mono); color: var(--accent); }
.steps .track { flex: 1; height: 4px; background: var(--grid); border-radius: 2px; overflow: hidden; }
.steps .track i { display: block; height: 100%; background: var(--accent); }
.solo h2 { margin: 0; font-size: 20px; text-wrap: balance; }
.check { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.check span { flex: 1; }
.check-all { border-bottom: 1px solid var(--line); font-weight: 600; }
.doc { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; line-height: 1.75; }
.doc h1 { font-size: 24px; margin: 16px 0 4px; }
.doc h2 { font-size: 17px; margin: 28px 0 6px; }
.doc p, .doc li { color: #2E3546; }

/* ── 레이아웃 ── */
.shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); height: 100%; }
.col { min-width: 0; height: 100%; overflow: auto; }
.side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px 12px; min-height: 0; }
.side .brand-sm { padding: 0 10px 20px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 8px; border: 0; background: none; font-weight: 500; color: var(--muted); text-align: left; }
.nav button svg { width: 18px; height: 18px; flex: none; }
.nav button.on { background: var(--accent-weak); color: var(--accent); }
.nav button.off { color: var(--faint); cursor: default; }
.nav-sep { display: block; margin: 12px 10px 4px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .04em; }
.nav button .pill { margin-left: auto; height: 20px; font-size: 11px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; position: relative; }
.acct { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: none; text-align: left; }
.acct:hover, .acct[aria-expanded="true"] { background: var(--bg); border-color: var(--line); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex: none; }
.acct-name { font-weight: 500; flex: 1; min-width: 0; }
.ver { font-family: var(--mono); font-size: 11px; color: var(--faint); padding: 0 10px; }
.menu { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(20,28,45,.12); padding: 4px; min-width: 160px; z-index: 30; display: flex; flex-direction: column; }
.menu button { border: 0; background: none; text-align: left; padding: 9px 12px; border-radius: 6px; }
.menu button:hover { background: var(--bg); }
.menu button.danger { color: var(--fail); }
.side .menu { bottom: 64px; left: 0; right: 0; }
.topm { display: none; }
.tabbar { display: none; }
.main { min-width: 0; padding: 32px 40px 64px; }
.main-inner { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

@container app (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topm { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .topm .menu { top: 46px; right: 12px; }
  .main { padding: 20px 16px 88px; }
  .tabbar.show { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 10; }
  .tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; font-size: 11px; color: var(--muted); }
  .tabbar button svg { width: 20px; height: 20px; }
  .tabbar button.on { color: var(--accent); font-weight: 600; }
  .tabbar button.off { color: var(--faint); }
}

/* ── 지원현황 ── */
.ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ph h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ph h1 .mono { font-size: 15px; color: var(--muted); font-weight: 500; }
.ph p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; line-height: 1.6; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 14px 18px; }
.stat { display: flex; align-items: baseline; gap: 6px; color: var(--muted); white-space: nowrap; }
.stat b { font-family: var(--mono); font-size: 17px; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
.stat.first b { color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); align-items: center; }
.legend .grp { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.sw { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.sw i { width: 14px; height: 8px; border-radius: 2px; display: inline-block; }
.legend .sep { width: 1px; height: 14px; background: var(--line); }
.r-fail { color: var(--fail); } .r-etc { color: var(--closed); } .r-ing { color: var(--ing); }
.chart-card { position: relative; }
.swipe { display: none; font-size: 12px; color: var(--muted); padding: 10px 16px 0; }
@container app (max-width: 820px) { .swipe { display: block; } }
.chart-scroll { overflow-x: auto; padding: 12px 0 8px; }
.chart { min-width: 860px; padding: 0 16px; }
.chead, .crow { display: grid; grid-template-columns: 150px minmax(0, 1fr); }
.chead { height: 40px; align-items: end; border-bottom: 1px solid var(--line); }
.months { display: grid; height: 100%; }
.months div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 6px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.months small { font-size: 10px; color: var(--faint); }
.cbody { position: relative; }
.gridlines { position: absolute; top: 0; bottom: 0; left: 150px; right: 0; display: grid; pointer-events: none; }
.gridlines div { border-left: 1px solid var(--grid); }
.gridlines div:last-child { border-right: 1px solid var(--grid); }
.crow { height: 38px; align-items: center; position: relative; border-radius: 6px; }
.crow:hover { background: rgba(43,63,124,.04); }
.cname { border: 0; background: none; text-align: left; padding: 0 10px 0 4px; display: flex; flex-direction: column; justify-content: center; min-width: 0; height: 100%; }
.cname span { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cname small { font-size: 11px; color: var(--faint); }
.cname:hover span { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.ctrack { position: relative; height: 100%; }
.seg-bar { position: absolute; top: 50%; height: 12px; transform: translateY(-50%); border-radius: 3px; min-width: 8px; }
.dot { position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--surface); }
.lbl { position: absolute; top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 12px; color: var(--muted); pointer-events: none; }
.lbl .res { font-weight: 500; }
.tip { position: absolute; z-index: 20; pointer-events: none; background: var(--fg); color: #fff; border-radius: 8px; padding: 9px 12px; font-size: 12px; line-height: 1.6; max-width: 300px; box-shadow: 0 6px 18px rgba(20,28,45,.2); }
.tip b { font-weight: 600; }
.tip .mono { color: #C9CFDB; }
.tbl-wrap { border-top: 1px solid var(--line); }
.tbl-wrap summary { cursor: pointer; padding: 12px 18px; font-weight: 500; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
.tbl-wrap summary::-webkit-details-marker { display: none; }
.tbl-wrap summary::before { content: "▸"; font-size: 11px; transition: transform .15s; }
.tbl-wrap[open] summary::before { transform: rotate(90deg); }
.tscroll { overflow-x: auto; padding: 0 18px 16px; }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--grid); font-size: 13px; vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.mono { white-space: nowrap; }
.empty { padding: 56px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty h2 { margin: 0; font-size: 18px; }
.empty p { margin: 0 0 8px; color: var(--muted); max-width: 40ch; line-height: 1.6; }
.empty svg { width: 120px; height: auto; margin-bottom: 6px; }
.skel { padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; }
.skel div { height: 12px; border-radius: 4px; background: linear-gradient(90deg, var(--grid) 0%, #F7F8FA 50%, var(--grid) 100%); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.err { padding: 40px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.err h2 { margin: 0; font-size: 16px; }
.err p { margin: 0 0 8px; color: var(--muted); }

/* ── 패널, 모달, 토스트 ── */
.scrim { position: fixed; inset: 0; background: rgba(20,28,45,.28); z-index: 40; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 41; display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(20,28,45,.14); animation: slide .2s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@container app (max-width: 820px) { .panel { width: 100%; box-shadow: none; } .scrim.under-panel { display: none; } }
.panel-head { display: flex; align-items: flex-start; gap: 10px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.panel-head h2 { margin: 0; font-size: 19px; }
.panel-head .sub { color: var(--muted); font-size: 13px; margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.panel-head .grow { flex: 1; min-width: 0; }
.panel-body { flex: 1; overflow: auto; padding: 4px 20px 32px; }
.panel-foot { border-top: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel-foot .spacer { flex: 1; }
.sec { padding: 18px 0; border-bottom: 1px solid var(--grid); display: flex; flex-direction: column; gap: 10px; }
.sec:last-child { border-bottom: 0; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-h h3 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.chain .st { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 6px; background: var(--bg); }
.chain .st i { width: 8px; height: 8px; border-radius: 50%; }
.chain .st .mono { font-size: 11px; color: var(--muted); }
.chain .arr { color: var(--faint); }
.job-title { font-weight: 500; }
.rev { border: 1px solid var(--line); border-radius: 8px; }
.rev-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.rev-h > button.t { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; display: flex; align-items: center; gap: 8px; font-weight: 500; }
.rev-h .mono { font-size: 12px; color: var(--muted); font-weight: 400; }
.rev-tools { display: flex; align-items: center; gap: 6px; position: relative; }
.rev-tools .menu { top: 38px; right: 0; }
.rev-body { border-top: 1px solid var(--grid); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.md { line-height: 1.7; font-size: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.md h4 { margin: 8px 0 0; font-size: 15px; }
.md p, .md ul { margin: 0; }
.md ul { padding-left: 20px; }
.md code { font-family: var(--mono); font-size: 12px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.blk { border-radius: 8px; padding: 10px 12px; border: 1px solid; display: flex; flex-direction: column; gap: 6px; }
.blk > .bt { font-size: 12px; font-weight: 600; }
.blk.mine { background: var(--mine); border-color: var(--mine-line); }
.blk.mine > .bt { color: var(--accent); }
.blk.retry { background: var(--retry); border-color: var(--retry-line); }
.blk.retry > .bt { color: var(--ing); }
.blk.plain { background: var(--bg); border-color: var(--line); }
.blk.memo { background: var(--memo); border-color: var(--memo-line); }
.blk.memo > .bt { color: var(--closed); }
.blk.follow { background: var(--surface); border-color: var(--line); border-style: dashed; }
.blk.follow > .bt { color: var(--muted); }
/* 후기 편집 페이지: 질문 그룹 목록이 본문. 질문·꼬리질문은 왼쪽(면접관), 내 답·다시 답한다면은 오른쪽(나), 메모는 가운데 */
.rp { max-width: 820px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.rp .back { align-self: flex-start; font-size: 13px; }
.rp-title { max-width: 420px; }

const REVIEW_TEMPLATE = "## Q. \n";
const BUB = {
  q:      { label: "질문", ph: "면접관이 한 질문" },
  follow: { label: "꼬리질문", head: "### 꼬리질문", ph: "이어서 받은 질문" },
  mine:   { label: "내 답", head: "### 내 답", ph: "그때 실제로 한 답" },
  retry:  { label: "다시 답한다면", head: "### 다시 답한다면", ph: "다음엔 이렇게 답하겠다" },
  memo:   { label: "메모", head: "### 메모", ph: "분위기, 면접관 반응, 기억할 점" },
};

const HEAD_TO_T = { "꼬리질문": "follow", "내 답": "mine", "다시 답한다면": "retry", "메모": "memo" };
/* 후기 = 질문 그룹 목록. 질문(## Q.)이 상위, 꼬리질문·내 답·다시 답한다면·메모(###)가 그 아래.
   사용자는 말풍선만 고치고, 저장되는 값은 serialize 결과(마크다운)다. */
let QID = 0;
const nid = () => "q" + (++QID);
function parseReview(src) {
  const groups = [];
  let last = null;
  for (const line of String(src || "").split("\n")) {
    if (line.startsWith("## ")) { groups.push({ id: nid(), fav: false, q: line.slice(3).replace(/^Q\.\s?/, "").trim(), kids: [] }); last = null; }
    else if (line.startsWith("### ")) {
      if (!groups.length) groups.push({ id: nid(), fav: false, q: "", kids: [] });
      const title = line.slice(4).trim();
      const t = HEAD_TO_T[title] || "memo";
      last = { t, v: HEAD_TO_T[title] ? "" : title + "\n" };
      groups[groups.length - 1].kids.push(last);
    }
    else if (last) last.v += (last.v ? "\n" : "") + line;
    else if (line.trim()) {
      if (!groups.length) groups.push({ id: nid(), fav: false, q: "", kids: [] });
      last = { t: "memo", v: line };
      groups[groups.length - 1].kids.push(last);
    }
  }
  groups.forEach(g => g.kids.forEach(k => k.v = k.v.trim()));
  return groups;
}
function serialize(groups) {
  return groups.map(g => [`## Q. ${g.q.replace(/\n+/g, " ")}`, ...g.kids.map(k => `${BUB[k.t].head}\n${k.v}`)].join("\n\n")).join("\n\n") + "\n";
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const day = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const ym = s => s.slice(0, 7);
const startOf = a => a.stages[0]?.at || a.endAt || "2026-10-14";
const endOf = a => a.endAt || a.stages[a.stages.length - 1]?.at || startOf(a);
const depthOf = a => Math.max(1, ...a.stages.map(s => s.kind));
function period(a) {
  const s = ym(startOf(a)), e = ym(endOf(a));
  if (s === e) return s;
  if (s.slice(0, 4) === e.slice(0, 4)) return `${s} ~ ${e.slice(5)}`;
  return `${s} ~ ${e}`;
}
function chainHtml(a) {
  const r = RESULT[a.result];
  const names = a.stages.map(s => esc(s.name)).join(" → ");
  return `${names}${names ? " → " : ""}<span class="res ${r.cls}">${r.sym} ${esc(a.resultText || r.label)}</span>`;
}
function stats(list) {
  const c = { all: list.length, ing: 0, doc: 0, test: 0, itv: 0, etc: 0 };
  list.forEach(a => {
    const d = depthOf(a);
    if (a.result === "ing") c.ing++;
    else if (a.result === "etc") c.etc++;
    else if (d === 1) c.doc++; else if (d === 2) c.test++; else c.itv++;
  });
  return c;
}
const sorted = list => [...list].sort((x, y) => day(startOf(x)) - day(startOf(y)) || x.id - y.id);
function filtered() {
  const all = sorted(S.data);
  if (S.filter === "ing") return all.filter(a => a.result === "ing");
  if (S.filter === "done") return all.filter(a => a.result !== "ing");
  return all;
}
function months(list) {
  const first = list.map(startOf).sort()[0], last = list.map(endOf).sort().slice(-1)[0];
  let [y, m] = first.split("-").map(Number);
  const [ey, em] = last.split("-").map(Number);
  const out = [];
  while (y < ey || (y === ey && m <= em)) { out.push([y, m]); m++; if (m > 12) { m = 1; y++; } }
  return out;
}
const fmtYm = ([y, m]) => `${y}.${String(m).padStart(2, "0")}`;

/* ───────── 마크다운 (면접 후기용 최소 렌더러, raw HTML 없음) ───────── */
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
}
function md(src) {
  const lines = String(src || "").split("\n");
  let html = "", block = null, para = [], list = [];
  const flushPara = () => { if (para.length) { const t = `<p>${inline(para.join(" "))}</p>`; block ? block.body += t : html += t; para = []; } };
  const flushList = () => { if (list.length) { const t = `<ul>${list.map(i => `<li>${inline(i)}</li>`).join("")}</ul>`; block ? block.body += t : html += t; list = []; } };
  const closeBlock = () => { flushPara(); flushList(); if (block) { html += `<div class="blk ${block.cls}"><div class="bt">${esc(block.title)}</div>${block.body}</div>`; block = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (line.startsWith("## ")) { closeBlock(); html += `<h4>${inline(line.slice(3))}</h4>`; }
    else if (line.startsWith("### ")) {
      closeBlock();
      const t = line.slice(4).trim();
      block = { title: t, body: "", cls: t === "내 답" ? "mine" : t === "다시 답한다면" ? "retry" : t === "메모" ? "memo" : t === "꼬리질문" ? "follow" : "plain" };
    }
    else if (/^[-*] /.test(line)) { flushPara(); list.push(line.slice(2)); }
    else if (!line.trim()) { flushPara(); flushList(); }
    else { flushList(); para.push(line); }
  }
  closeBlock();
  return html || `<p class="hint">내용이 없어요.</p>`;
}

        .map(([k, l, n]) => `<span class="stat ${k}"><b>${S.load === "ok" ? n : "–"}</b>${l}</span>`).join("")}

  if (empty) return head + statRow + `<div class="card empty">${ICONS.empty}<h2>아직 기록한 지원이 없어요</h2><p>지원한 회사와 전형 단계를 적으면 여기에 타임라인으로 쌓여요.</p><button class="btn btn-primary" data-act="new-app">+ 지원 추가</button></div>`;

  const counts = { all: all.length, ing: c.ing, done: all.length - c.ing };
  const legend = `<div class="toolbar">
      <div class="legend">
        <span class="grp">${[1, 2, 3, 4].map(d => `<span class="sw"><i style="background:var(--d${d})"></i>${KIND[d]}</span>`).join("")}</span>

    </div>`;
  return head + statRow + legend + viewChart();
}

function viewChart() {
  const list = filtered();
  if (!list.length) return `<div class="card empty"><h2>해당하는 지원이 없어요</h2><p>필터를 바꿔 보세요.</p></div>`;
  const ms = months(list);
  const rs = Date.UTC(ms[0][0], ms[0][1] - 1, 1) / 864e5;
  const last = ms[ms.length - 1];
  const re = Date.UTC(last[0], last[1], 1) / 864e5;
  const pct = s => ((day(s) - rs) / (re - rs)) * 100;
  const cols = `grid-template-columns:repeat(${ms.length},1fr)`;
  const head = `<div class="chead"><span></span><div class="months" style="${cols}">${ms.map(([y, m], i) => `<div>${i === 0 || m === 1 ? `<small>${y}</small>` : ""}${String(m).padStart(2, "0")}</div>`).join("")}</div></div>`;
  const rows = list.map(a => {
    const d = depthOf(a), s = pct(startOf(a)), e = pct(endOf(a));
    const color = `var(--d${d})`;
    const dots = a.stages.slice(1).map(st => `<span class="dot" style="left:${pct(st.at)}%;background:${color}"></span>`).join("");
    const lbl = e < 60 ? `left:calc(${e}% + 10px)` : `right:calc(${100 - s}% + 10px)`;
    return `<div class="crow" data-row="${a.id}">
      <button class="cname" data-act="open" data-id="${a.id}"><span>${esc(a.company)}</span>${a.sub ? `<small>${esc(a.sub)}</small>` : ""}</button>
      <div class="ctrack"><span class="seg-bar" style="left:${s}%;width:${Math.max(e - s, 0)}%;background:${color}"></span>${dots}<span class="lbl" style="${lbl}">${chainHtml(a)}</span></div>
    </div>`;
  }).join("");
  const table = `<details class="tbl-wrap" ${S.tableOpen ? "open" : ""} data-act-toggle="table"><summary>표로 보기</summary><div class="tscroll"><table>
      <thead><tr><th>시기</th><th>기업</th><th>진행 단계</th><th>결과</th></tr></thead>
      <tbody>${list.map(a => { const r = RESULT[a.result]; return `<tr><td class="mono">${period(a)}</td><td><button class="link" data-act="open" data-id="${a.id}">${esc(a.company)}</button>${a.sub ? ` <span class="hint">${esc(a.sub)}</span>` : ""}</td><td>${a.stages.map(s => esc(s.name)).join(" → ")}</td><td class="${r.cls}">${r.sym} ${esc(a.resultText || r.label)}</td></tr>`; }).join("")}</tbody>
    </table></div></details>`;
  return `<div class="card chart-card" id="chartCard">
    <div class="swipe">옆으로 밀어서 보기 →</div>
    <div class="chart-scroll"><div class="chart">${head}<div class="cbody"><div class="gridlines" style="${cols}">${ms.map(() => "<div></div>").join("")}</div>${rows}</div></div></div>
    ${table}
    <div class="tip" id="tip" hidden></div>
  </div>`;
}

/* 편집 페이지 열기·닫기. from: 새 후기를 어디서 눌렀는지 (detail | reviews) */
function openReviewPage(appId, rid, from) {
  S.rp = { appId, rid, from: from || "view" };
  if (rid === "new") {
    S.reviewDraft = { company: findApp(appId)?.company || "", appId: appId || null, round: "", custom: false, date: "", extra: "", groups: [{ id: nid(), fav: false, q: "", kids: [] }] };
    if (appId) pickNextRound(S.reviewDraft);
  } else {
    const rv = findReview(appId, rid);
    S.reviewDraft = { company: findApp(appId).company, appId, round: rv.round, custom: !roundsOf(findApp(appId)).some(s => s.name === rv.round), date: rv.date, extra: rv.extra, groups: JSON.parse(JSON.stringify(rv.groups)) };
  }
  S.activeG = rid === "new" ? 0 : null;
  if (rid === "new") S.focusSel = appId ? "#q-0" : "#rd-company";
  S.panel = null; S.route = "review"; S.modal = null;
}
function leaveEditor(savedRid, savedApp) {
  const { appId, rid, from } = S.rp;
  S.reviewDraft = null;
  if (savedRid || rid !== "new") openReviewView(savedApp || appId, savedRid || rid, rid === "new" ? from : (S.rv?.from || "reviews"));
  else if (from === "detail" && appId) { S.route = "apps"; openDetail(appId); }
  else S.route = "reviews";
}
/* 면접 차수: 그 지원 건의 면접 단계(1차 면접 이상)에서 고르거나 직접 입력 */
const roundsOf = a => (a ? a.stages.filter(s => s.kind >= 3) : []);
function pickNextRound(d) {
  const a = findApp(d.appId), done = new Set(a.reviews.map(r => r.round));
  const next = roundsOf(a).find(s => !done.has(s.name)) || roundsOf(a)[0];
  if (next) Object.assign(d, { round: next.name, custom: false, date: next.at });
  else Object.assign(d, { round: "", custom: true, date: "" });
}
/* 회사 이름 목록(최근 지원 순)과, 그 회사의 지원 건들(서류 제출일로 구분) */
const companies = () => [...new Set(sorted(S.data).reverse().map(a => a.company))];
const appsOf = company => sorted(S.data.filter(a => a.company === company)).reverse();
function setReviewCompany(d, company) {
  d.company = company; d.appId = null;
  Object.assign(d, { round: "", custom: false, date: "" });
  const list = appsOf(company);
  if (list.length === 1) { d.appId = list[0].id; pickNextRound(d); }
}
function reviewHint() {
  const d = S.reviewDraft;
  if (!d.company) return "어느 회사 면접인지 골라 주세요";
  if (!d.appId) return "서류 제출일을 골라 주세요";
  if (!d.round.trim()) return d.custom ? "면접 차수를 적어 주세요" : "면접 차수를 골라 주세요";
  return "";
}
function reviewMeta(d) {

    ${d.custom ? `<label class="field"><span>차수 이름<em>*</em></span><input class="input" id="rd-custom" data-bind="rd-custom" value="${esc(d.round)}" placeholder="예: 임원 면접"></label>` : ""}

    ${a && !rounds.length ? `<p class="hint rp-meta-note">이 지원 건에는 면접 단계가 없어요. 차수를 직접 적거나, 지원 건 수정에서 면접 단계를 추가해 주세요.</p>` : ""}
  </div>`;
}
const reviewTitle = rv => rv.round + (rv.extra ? ` (${rv.extra})` : "");

/* ───────── 면접 후기: 공통 ───────── */
const findReview = (appId, rid) => findApp(appId)?.reviews.find(r => r.id === rid);
function allReviews() {
  return S.data.flatMap(a => a.reviews.map(rv => ({ a, rv }))).sort((x, y) => y.rv.date.localeCompare(x.rv.date));
}
/* 목록 정렬: 같은 회사는 한 묶음. 묶음끼리는 가장 최근 면접일이 늦은 순(2차가 추가되면 그 회사가 위로), 묶음 안은 면접일 순(1차 → 2차) */
function companyGroups(list) {
  const map = new Map();
  for (const it of list) {
    const k = it.a.company;
    if (!map.has(k)) map.set(k, { company: k, items: [] });
    map.get(k).items.push(it);
  }
  return [...map.values()].map(g => {
    g.items.sort((x, y) => x.rv.date.localeCompare(y.rv.date));
    g.latest = g.items[g.items.length - 1].rv.date;
    g.subs = new Set(g.items.map(x => x.a.id)).size;
    return g;
  }).sort((x, y) => y.latest.localeCompare(x.latest));
}
function reviewRow(a, rv, from, showCompany) {
  const favs = rv.groups.filter(g => g.fav).length;
  return `<button class="rrow" data-act="rv-open" data-app="${a.id}" data-id="${rv.id}" data-from="${from}">
    <span class="mono rdate">${rv.date}</span>
    <span class="rmain"><b>${esc(reviewTitle(rv))}</b>${showCompany ? `<span class="hint">서류 제출 <span class="mono">${startOf(a)}</span>${a.sub ? ` · ${esc(a.sub)}` : ""}</span>` : ""}</span>
    <span class="rmeta"><span class="pill">질문 ${rv.groups.length}</span>${favs ? `<span class="pill fav">${ICONS.starOn}${favs}</span>` : ""}</span>
  </button>`;
}
function readKids(g) {
  return g.kids.map(k => `<div class="bub bub-${k.t} ro"><div class="bub-h"><span class="bub-label">${BUB[k.t].label}</span></div><div class="ro-text">${esc(k.v) || '<span class="hint">비어 있음</span>'}</div></div>`).join("");
}
function starBtn(appId, rid, g) {
  return `<button type="button" class="star${g.fav ? " on" : ""}" data-act="fav" data-app="${appId}" data-id="${rid}" data-q="${g.id}" aria-pressed="${g.fav}" aria-label="${g.fav ? "즐겨찾기 해제" : "즐겨찾기"}" title="${g.fav ? "즐겨찾기 해제" : "즐겨찾기"}">${g.fav ? ICONS.starOn : ICONS.starOff}</button>`;
}

/* ───────── 페이지: 면접 후기 목록 (/reviews) ───────── */
function viewReviews() {
  const list = allReviews();
  const favQs = list.flatMap(({ a, rv }) => rv.groups.filter(g => g.fav).map(g => ({ a, rv, g })));
  const head = `<div class="ph">
      <div><h1>면접 후기</h1><p>회사별로 묶어서 최근 면접이 있는 회사부터 보여줘요. 질문 옆 별을 누르면 즐겨찾기에 모여요.</p></div>
      <button class="btn btn-primary" data-act="review-new" data-from="reviews" ${S.data.length ? "" : "disabled"}>+ 후기 추가</button>
    </div>
    <div class="toolbar"><div class="seg" role="group" aria-label="보기">
      <button aria-pressed="${S.revFilter !== "fav"}" data-act="rev-filter" data-f="all">전체 후기<span class="n">${list.length}</span></button>
      <button aria-pressed="${S.revFilter === "fav"}" data-act="rev-filter" data-f="fav">★ 즐겨찾기 질문<span class="n">${favQs.length}</span></button>

    return head + `<div class="favlist">${favQs.map(({ a, rv, g }) => `<article class="card favq" id="fq-${g.id}">
        <div class="favq-h">

        </div>
        ${g.kids.length ? `<details class="favq-d"${S.favOpen?.[g.id] ? " open" : ""} data-fav-open="${g.id}"><summary>답 보기 <span class="hint">${g.kids.length}</span></summary><div class="ro-kids">${readKids(g)}</div></details>` : ""}

/* ───────── 공고분석 ───────── */
const findJob = id => S.jobs.find(j => j.id === id);
const jobOfApp = appId => S.jobs.find(j => j.appId === appId);
const jobStatus = j => `<span class="pill ${JSTATUS[j.status].cls}">${JSTATUS[j.status].label}</span>`;
const gradePill = c => c?.grade ? `<span class="pill ${GRADE[c.grade] || ""}">${esc(c.grade)}${c.score !== "" && c.score != null ? ` · ${esc(c.score)}` : ""}</span>` : "";
const mark = (m, label = true) => `<span class="mk ${MATCH[m].cls}">${MATCH[m].sym}${label ? " " + MATCH[m].label : ""}</span>`;
function matchCount(reqs) {
  const c = { full: 0, part: 0, none: 0 };
  reqs.forEach(r => c[r.level]++);

}
const countTag = c => `<span class="mcount"><span class="m-full">● ${c.full}</span><span class="m-part">◐ ${c.part}</span><span class="m-none">○ ${c.none}</span></span>`;

/* 근거 경험 태그: 경험과 이어지면 누를 수 있는 버튼 */

/* 목록 (/jobs): 최근에 분석한 순 */

/* 분석 상세 (/jobs/:id) */

    sec("highlight", "부각할 경험", `<span class="hint">서류 기준 순위</span>`, `

        : `<p class="hint" style="margin:0">아직 지원 기록과 연결되지 않았어요. 지원했다면 [편집]에서 연결해 주세요.</p>`}

/* 분석 추가·편집 (/jobs/new, /jobs/:id/edit). 목록형 칸은 편집하는 동안 "한 줄에 하나" 글로 다룬다 */
const LIST_PATHS = ["fitNotes", "toWrite", "gaps", "dbSuggest", "askBack", "checks", "culture.risks"];
const getP = (o, p) => p.split(".").reduce((x, k) => x?.[k], o);
const setP = (o, p, v) => { const ks = p.split("."), last = ks.pop(); ks.reduce((x, k) => x[k], o)[last] = v; };
const ROW_NEW = {
  conditions: () => ({ label: "", state: "check", text: "" }),
  "culture.items": () => ({ name: "", max: 25, score: "", quote: "" }),
  highlight: () => ({ exp: "", maps: "", why: "" }),
  excluded: () => ({ exp: "", where: "" }),
  questions: () => ({ q: "", a: "" }),
};
function toDraft(j) {
  const d = JSON.parse(JSON.stringify(j));
  LIST_PATHS.forEach(p => setP(d, p, (getP(d, p) || []).join("\n")));
  d.reqs.forEach(r => r.ev = r.ev.join(", "));
  return d;
}
function fromDraft(d) {
  const j = JSON.parse(JSON.stringify(d));
  LIST_PATHS.forEach(p => setP(j, p, String(getP(j, p) || "").split("\n").map(s => s.trim()).filter(Boolean)));
  j.reqs = j.reqs.filter(r => r.text.trim()).map(r => ({ ...r, ev: String(r.ev).split(/[,，]/).map(s => s.trim()).filter(Boolean) }));
  j.conditions = j.conditions.filter(x => x.label.trim());
  j.culture.items = j.culture.items.filter(x => x.name.trim()).map(x => ({ ...x, score: x.score === "" ? "" : Number(x.score), max: Number(x.max) || 0 }));
  j.culture.score = j.culture.score === "" ? "" : Number(j.culture.score);
  j.highlight = j.highlight.filter(x => x.exp.trim());
  j.excluded = j.excluded.filter(x => x.exp.trim());
  j.questions = j.questions.filter(x => x.q.trim());
  return j;
}
function jobHint() {
  const d = S.jobDraft;
  if (!d.company.trim()) return "회사명을 입력하면 저장할 수 있어요";
  return "";
}
/* 편집 칸: 모든 칸에 보이는 라벨과 짧은 설명을 붙인다 */
function fieldEd(c, path, i, v) {
  const id = `jt-${path.replace(".", "-")}-${i}-${c.k}`;
  const attrs = `id="${id}" data-bind="jt" data-path="${path}" data-i="${i}" data-k="${c.k}"`;
  if (c.options) return `<select class="select" ${attrs}>${Object.entries(c.options).map(([k, l]) => `<option value="${k}" ${String(v) === k ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  if (c.area) return `<textarea class="textarea sm" ${attrs} placeholder="${c.ph || ""}">${esc(v)}</textarea>`;
  return `<input class="input${c.mono ? " mono" : ""}" ${attrs} value="${esc(v)}" placeholder="${c.ph || ""}"${c.mono ? ' inputmode="numeric"' : ""}>`;
}
function fieldL(c, path, i, v) {
  const id = `jt-${path.replace(".", "-")}-${i}-${c.k}`;
  return `<div class="fl${c.wide ? " wide" : ""}"><label class="fl-k" for="${id}">${c.label}${c.help ? `<span class="fl-h">${c.help}</span>` : ""}</label>${fieldEd(c, path, i, v)}</div>`;
}
/* 선택지가 몇 개 안 되는 칸은 드롭다운 대신 버튼으로 */
function choiceL(label, help, name, opts, v, bind) {
  return `<div class="fl"><span class="fl-k">${label}${help ? `<span class="fl-h">${help}</span>` : ""}</span>
    <div class="choice" role="radiogroup" aria-label="${label}">${Object.entries(opts).map(([k, o]) => `<label class="${o.cls || ""}"><input type="radio" name="${name}" value="${k}" ${String(v) === k ? "checked" : ""} ${bind}> ${o.text}</label>`).join("")}</div></div>`;
}

function rowsEd(path, cols, unit, addLabel) {
  const rows = getP(S.jobDraft, path);
  return `<div class="rows-ed">
    ${rows.map((r, i) => `<div class="row-card">
      <div class="row-card-h"><b>${unit} ${i + 1}</b><button type="button" class="btn btn-text danger btn-sm" data-act="jrow-del" data-path="${path}" data-i="${i}">이 ${unit} 삭제</button></div>
      <div class="row-fields">${cols.map(c => c.choice
        ? choiceL(c.label, c.help, `${path}-${i}-${c.k}`, c.choice, r[c.k], `data-bind="jt" data-path="${path}" data-i="${i}" data-k="${c.k}"`)
        : fieldL(c, path, i, r[c.k])).join("")}</div>
    </div>`).join("")}
    <div><button type="button" class="btn btn-sm" data-act="jrow-add" data-path="${path}">+ ${addLabel}</button></div>
  </div>`;
}

function openJob(id, from) { S.job = { id, from: from || S.job?.from || "jobs" }; S.jobDraft = null; S.jobMenu = false; S.route = "job"; S.panel = null; }
function editJob(j, from) {
  S.jobDraft = toDraft(j || EMPTY_JOB());
  if (from) S.job = { id: j?.id ?? null, from };
  S.jobMenu = false; S.route = "job"; S.panel = null;
  if (!j?.company) S.focusSel = "#j-company";
}
function jobBack() {
  const from = S.job?.from, j = S.job?.id != null ? findJob(S.job.id) : null;
  if (from === "detail" && (j?.appId || S.job.appId)) { S.route = "apps"; openDetail(j?.appId || S.job.appId); }
  else S.route = "jobs";
}

const findExp = id => S.exps.find(x => x.id === id);
const expByTag = tag => S.exps.find(x => x.key && tag.includes(x.key));
const expPeriod = x => x.from ? `${x.from.replace("-", ".")} – ${x.to ? x.to.replace("-", ".") : "진행 중"}` : "기간 미입력";
const verifiedPill = x => x.verified ? `<span class="pill vf-ok">확인됨</span>` : `<span class="pill vf-no">미확인</span>`;
/* 고쳐야 할 것: 목록과 상세 위쪽에 같은 기준으로 보여준다 */
function expNeeds(x) {
  const n = [];
  if (!x.numbers.trim()) n.push({ label: "결과 수치 없음", detail: "결과에 숫자가 없어요. 모르면 \"수치 미기재\"로 남겨 두되, 찾을 수 있으면 채워 주세요." });
  const emptyStar = [["situation", "상황"], ["task", "과제"]].filter(([k]) => !x[k].trim()).map(([, l]) => l);
  if (!x.actions.length) emptyStar.push("행동");
  if (!x.resultMine.length && !x.resultTeam.length) emptyStar.push("결과");
  if (emptyStar.length) n.push({ label: `비어 있음 ${emptyStar.length}`, detail: `${emptyStar.join(" · ")}이(가) 비어 있어요.` });
  const noAns = x.qa.filter(q => !q.a.trim());
  if (noAns.length) n.push({ label: `답변 작성 필요 ${noAns.length}`, detail: `예상 질문 답변이 비어 있어요: ${noAns.map(q => q.q).join(" / ")}` });
  if (x.missing.length) n.push({ label: `보완 필요 ${x.missing.length}`, detail: `기록이 없는 것: ${x.missing.join(" · ")}` });
  return n;
}

      <button class="btn btn-primary" data-act="exp-new">+ 경험 추가</button>

/* 목록 (/experiences): 공고분석처럼 게시판형, 한 줄 = 경험 하나 */
function viewExps() {
  if (S.expView === "calendar") return expHead() + viewExpCalendar();
  const f = S.expFilter;
  const q = f.q.trim().toLowerCase();
  const all = [...S.exps].sort((a, b) => (b.from || "").localeCompare(a.from || ""));
  const cnt = { all: all.length, unv: all.filter(x => !x.verified).length, need: all.filter(x => expNeeds(x).length).length };
  const list = all
    .filter(x => f.mode === "unv" ? !x.verified : f.mode === "need" ? expNeeds(x).length : true)
    .filter(x => !q || [x.name, x.summary, x.org, x.project, ...x.tags].join(" ").toLowerCase().includes(q));
  const head = `${expHead()}
    <div class="toolbar">
      <div class="seg" role="group" aria-label="보기">${[["all", "전체"], ["unv", "미확인"], ["need", "보완 필요"]].map(([k, l]) => `<button aria-pressed="${f.mode === k}" data-act="exp-mode" data-f="${k}">${l}<span class="n">${cnt[k]}</span></button>`).join("")}</div>
      <input class="input xq-in" type="search" id="exp-q" data-bind="exp-q" value="${esc(f.q)}" placeholder="제목·요약·태그로 찾기" aria-label="경험 검색">
    </div>`;
  if (!all.length) return head + `<div class="card empty"><h2>아직 정리한 경험이 없어요</h2><p>프로젝트 하나를 골라 상황·과제·행동·결과로 적어 보세요.</p><button class="btn btn-primary" data-act="exp-new">+ 경험 추가</button></div>`;
  if (!list.length) return head + `<div class="card empty"><h2>조건에 맞는 경험이 없어요</h2><p>검색어나 보기를 바꿔 보세요.</p></div>`;
  return head + `<div class="card rlist big">${list.map(x => {
    const needs = expNeeds(x);
    return `<button class="rrow xrow" data-act="exp-open" data-id="${x.id}" data-from="exps">
      <span class="rmain"><b>${esc(x.name)}</b><span class="xsum">${esc(x.summary) || '<span class="hint">요약 없음</span>'}</span></span>
      <span class="rmeta">${verifiedPill(x)}${needs.map(n => `<span class="pill gap">${n.label}</span>`).join("")}</span>
    </button>`;
  }).join("")}</div>
  <p class="hint">미확인 = AI가 만들거나 고친 뒤 아직 내가 읽지 않은 경험. 보완 필요 = 결과 수치, 빈 항목, 답변이 비어 있는 경험.</p>`;
}

/* 추가·편집 (/experiences/new, /experiences/:id/edit): 공고분석 편집과 같은 규칙 (칸마다 라벨·설명, 표는 번호 카드) */
const XLIST = ["resultMine", "resultTeam", "framing", "missing", "appeal.questions"];
function toXDraft(x) {
  const d = JSON.parse(JSON.stringify(x));
  XLIST.forEach(p => setP(d, p, getP(d, p).join("\n")));
  d.tags = d.tags.join(", ");
  d.actions.forEach(a => a.points = a.points.join("\n"));
  d.related.forEach(r => r.id = String(r.id));
  d.groupId = d.groupId == null ? "" : String(d.groupId);
  return d;
}
function fromXDraft(d) {
  const x = JSON.parse(JSON.stringify(d));
  const lines = v => String(v || "").split("\n").map(s => s.trim()).filter(Boolean);
  XLIST.forEach(p => setP(x, p, lines(getP(x, p))));
  x.name = x.name.trim();
  x.tags = x.tags.split(/[,，]/).map(v => v.trim()).filter(Boolean);
  x.actions = x.actions.filter(a => a.title.trim() || a.points.trim()).map(a => ({ ...a, points: lines(a.points) }));
  x.asked = x.asked.filter(a => a.q.trim()).map(({ ref, ...a }) => {
    if (!ref) return { q: a.q, where: a.where };
    const [app, rid] = ref.split("|");
    return { q: a.q, where: a.where, app: Number(app), rid };
  });
  x.qa = x.qa.filter(q => q.q.trim());
  x.related = x.related.filter(r => r.id).map(r => ({ ...r, id: Number(r.id) }));
  x.groupId = x.groupId ? Number(x.groupId) : null;
  x.verified = true;
  return x;
}

const findXGroup = id => S.expGroups.find(g => g.id === id);
const NOW_YM = "2026-10";
const ymIdx = ym => { const [y, m] = ym.split("-").map(Number); return y * 12 + (m - 1); };
const ymOf = i => `${Math.floor(i / 12)}-${String(i % 12 + 1).padStart(2, "0")}`;
const orgCompany = x => (x.org || "").split("·")[0].trim();
/* 소속 회사마다 색: 이력의 경력 순서대로, 개인 프로젝트는 따로 */
function orgColor(x) {
  const c = orgCompany(x);
  if (!c || c.includes("개인")) return "oc-personal";
  const i = [...S.resume.careers].sort((p, q) => p.from.localeCompare(q.from)).findIndex(k => k.company === c);
  return i < 0 ? "oc-unknown" : `oc-${i % 4}`;
}
/* 흐름 점검: 이력(재직 기간)과 맞는지 */
function expIssues(x) {
  const out = [];
  if (!x.from) { out.push("시작 연월이 없어요"); return out; }
  if (x.to && x.to < x.from) out.push("끝이 시작보다 빨라요");
  const c = orgCompany(x), car = S.resume.careers.find(k => k.company === c);
  if (car) {
    if (x.from < car.from || (x.to && car.to && x.to > car.to)) out.push(`${c} 재직 기간(${car.from.replace("-", ".")} – ${car.to ? car.to.replace("-", ".") : "재직 중"}) 밖이에요`);
    if (!x.to && car.to) out.push(`끝이 비어 있어 "진행 중"으로 보이는데, ${c}에서 ${car.to.replace("-", ".")}에 퇴사했어요`);
  } else if (c && !c.includes("개인")) out.push(`이력에 없는 소속이에요 (${c})`);
  return out;
}
/* 캘린더 줄 순서: 그룹은 한 덩어리로, 덩어리끼리는 가장 이른 시작 순 */
function calendarUnits() {
  const units = [], byGroup = new Map();
  for (const x of S.exps) {
    if (x.groupId && findXGroup(x.groupId)) {
      if (!byGroup.has(x.groupId)) { const u = { group: findXGroup(x.groupId), items: [] }; byGroup.set(x.groupId, u); units.push(u); }
      byGroup.get(x.groupId).items.push(x);
    } else units.push({ group: null, items: [x] });
  }
  const start = u => u.items.map(x => x.from || "9999").sort()[0];
  units.forEach(u => u.items.sort((a, b) => (a.from || "9999").localeCompare(b.from || "9999")));
  return units.sort((a, b) => start(a).localeCompare(start(b)));
}

const gStart = u => u.items.map(x => x.from).filter(Boolean).sort()[0] || NOW_YM;
const gEnd = u => Math.max(...u.items.map(x => ymIdx(x.to || x.from || NOW_YM)));

/* 서류 글 → 미리보기 HTML. # 제목, ## 섹션, ### 소제목, - 목록, --- 쪽 나눔 */
function docMd(src) {
  const out = []; let list = [];
  const flush = () => { if (list.length) { out.push(`<ul>${list.map(i => `<li>${inline(i)}</li>`).join("")}</ul>`); list = []; } };
  for (const raw of String(src || "").split("\n")) {
    const l = raw.trimEnd();
    if (/^---\s*$/.test(l)) { flush(); out.push('<div class="pgbreak"></div>'); }
    else if (l.startsWith("### ")) { flush(); out.push(`<h3>${inline(l.slice(4))}</h3>`); }
    else if (l.startsWith("## ")) { flush(); out.push(`<h2>${inline(l.slice(3))}</h2>`); }
    else if (l.startsWith("# ")) { flush(); out.push(`<h1>${inline(l.slice(2))}</h1>`); }
    else if (/^- /.test(l)) list.push(l.slice(2));
    else if (!l.trim()) flush();
    else { flush(); out.push(`<p>${inline(l)}</p>`); }
  }
  flush();
  return out.join("");
}

  const tmp = document.createElement("div"); tmp.innerHTML = docMd(src);
  host.innerHTML = "";
  let page = null, n = 0;
  const newPage = () => { n++; const p = document.createElement("div"); p.className = "pg"; p.innerHTML = `<div class="pg-in"></div><span class="pg-no">${n}</span>`; host.appendChild(p); page = p.querySelector(".pg-in"); };
  newPage();
  for (const el of [...tmp.children]) {
    if (el.classList.contains("pgbreak")) { newPage(); continue; }
    page.appendChild(el);
    if (page.scrollHeight > page.clientHeight + 1 && page.children.length > 1) { page.removeChild(el); newPage(); page.appendChild(el); }
  }
  host.querySelectorAll(".pg-no").forEach(e => e.textContent = `${e.textContent} / ${n}`);
  const w = host.parentElement.clientWidth - 24; host.style.zoom = w > 0 ? Math.min(1, w / 595) : 1;
  const cnt = document.getElementById("pg-count"); if (cnt) cnt.textContent = `${n}쪽`;
}

/* 리뷰 한 덩어리 (예: "1. 이력서·경력기술서 — 보완 권장") */
function reviewPart(g, p, curType) {
  const jumpBtn = f => {
    if (!f.jump) return "";
    if (curType === f.jump.type) return `<button type="button" class="link sm" data-act="doc-jump" data-find="${esc(f.jump.find)}">편집기에서 찾기</button>`;
    return `<button type="button" class="link sm" data-act="doc-open" data-t="${f.jump.type}" data-find="${esc(f.jump.find)}">${DOCTYPE[f.jump.type].label}에서 보기 ↗</button>`;
  };
  const chk = (item, kind) => `<label class="rchk"><input type="checkbox" data-act="rv-done" data-g="${g.id}" data-no="${p.no}" data-k="${kind}" data-id="${item.id}" ${item.done ? "checked" : ""}> 반영함</label>`;
  return `<article class="rpart">
    <h3 class="rpart-h"><span class="mono">${p.no}.</span> ${esc(p.title)} <span class="pill ${VERDICT[p.verdict] || ""}">${esc(p.verdict)}</span></h3>
    ${p.intro ? `<div class="rintro"><span class="k">면접관이 동료에게 할 한 줄 소개</span><p>“${esc(p.intro)}”</p></div>` : ""}
    ${p.fixFirst.length ? `<div class="rblock"><h4>먼저 고칠 것</h4>${p.fixFirst.map(f => `<div class="rfix${f.done ? " done" : ""}">
        <div class="rfix-h"><b>${esc(f.label)}</b>${chk(f, "fix")}</div>
        <p class="rfix-head">${esc(f.headline)}</p>
        <ul>${f.details.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        ${jumpBtn(f)}
      </div>`).join("")}</div>` : ""}
    ${p.stuck.length ? `<div class="rblock"><h4>그 밖에 읽다 막히는 곳</h4><ul class="rstuck">${p.stuck.map(s => `<li class="${s.done ? "done" : ""}"><span>${esc(s.text)}</span>${chk(s, "stuck")}</li>`).join("")}</ul></div>` : ""}
    ${p.good.length ? `<div class="rblock good"><h4>면접관이 궁금해할 곳 <span class="hint">좋은 신호</span></h4><ul>${p.good.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
  </article>`;
}

function dgHint() {
  const n = S.newDg;
  if (!n.company.trim()) return "회사를 입력해 주세요";
  if (!n.date) return "작성날짜를 골라 주세요";
  if (S.docGroups.some(g => g.company === n.company.trim() && g.date === n.date)) return `‘${n.company.trim()} · ${n.date}’ 묶음이 이미 있어요`;
  return "";
}
function selectInEditor(find) {
  const ta = document.getElementById("doc-ed");
  if (!ta || !find) return;
  const at = ta.value.indexOf(find);
  if (at < 0) { toast("편집기에서 그 부분을 찾지 못했어요"); return; }
  const end = ta.value.indexOf("\n", at);
  ta.focus({ preventScroll: true });
  ta.setSelectionRange(at, end < 0 ? ta.value.length : end);
  const lineH = parseFloat(getComputedStyle(ta).lineHeight) || 22, lines = ta.value.slice(0, at).split("\n").length - 1;
  ta.scrollTop = Math.max(0, lines * lineH - 40);
}
let pvTimer;
function refreshPreview(delay = 0) {
  clearTimeout(pvTimer);
  pvTimer = setTimeout(() => { const g = S.dg && findGroup(S.dg.id), d = g && S.doc && findGDoc(g, S.doc.type); if (d) paginate(document.getElementById("doc-pv"), d.body); }, delay);
}

/* 면접 후기: 손잡이 드래그로 순서 바꾸기. 질문은 그룹째, 하위 말풍선은 다른 질문 밑으로도 옮길 수 있다. */
let drag = null;
app.addEventListener("pointerdown", e => {
  const h = e.target.closest("[data-drag]");
  if (!h || e.button > 0) return;
  e.preventDefault();
  const type = h.dataset.drag;
  const el = type === "g" ? h.closest(".qgroup") : h.closest(".kid");
  drag = { type, el, gi: Number(h.dataset.g), moved: false };
  el.classList.add("dragging");
  app.classList.add("is-dragging");
});
function insertByY(list, el, items, y) {
  const next = items.find(x => x !== el && y < x.getBoundingClientRect().top + x.getBoundingClientRect().height / 2);
  if (next) { if (el.nextElementSibling !== next) list.insertBefore(el, next); }
  else if (list.lastElementChild !== el) list.appendChild(el);
}
window.addEventListener("pointermove", e => {
  if (!drag) return;
  drag.moved = true;
  const y = e.clientY;
  if (drag.type === "g") {
    const list = document.getElementById("qlist");
    insertByY(list, drag.el, [...list.querySelectorAll(":scope > .qgroup")], y);
  } else {
    const groups = [...app.querySelectorAll(".qgroup")];
    let target = groups.find(g => { const r = g.getBoundingClientRect(); return y >= r.top && y <= r.bottom; });
    if (!target) target = y < groups[0].getBoundingClientRect().top ? groups[0] : groups[groups.length - 1];
    const list = target.querySelector(".kids");
    insertByY(list, drag.el, [...list.querySelectorAll(".kid")], y);
  }
  const col = app.querySelector(".col"), r = col.getBoundingClientRect();
  if (y < r.top + 48) col.scrollTop -= 12; else if (y > r.bottom - 72) col.scrollTop += 12;
});
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  app.classList.remove("is-dragging");
  d.el.classList.remove("dragging");
  if (!d.moved) return;
  const old = S.reviewDraft.groups;
  if (d.type === "g") {
    const order = [...document.querySelectorAll("#qlist > .qgroup")].map(x => Number(x.dataset.g));
    S.reviewDraft.groups = order.map(i => old[i]);
    S.activeG = order.indexOf(d.gi);
  } else {
    const lists = [...app.querySelectorAll(".kids")];
    const kids = lists.map(l => [...l.querySelectorAll(".kid")].map(x => old[Number(x.dataset.g)].kids[Number(x.dataset.k)]));
    old.forEach((g, i) => g.kids = kids[i]);
    S.activeG = lists.indexOf(d.el.closest(".kids"));
  }
  render();
}
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

app.addEventListener("keydown", e => {
  const h = e.target.closest?.("[data-drag]");
  if (!h || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
  e.preventDefault();
  const up = e.key === "ArrowUp", G = S.reviewDraft.groups, gi = Number(h.dataset.g);
  if (h.dataset.drag === "g") {
    const ni = gi + (up ? -1 : 1);
    if (ni < 0 || ni >= G.length) return;
    [G[gi], G[ni]] = [G[ni], G[gi]];
    S.activeG = ni; S.focusSel = `[data-drag="g"][data-g="${ni}"]`;
  } else {
    const ki = Number(h.dataset.k), kids = G[gi].kids, [item] = kids.splice(ki, 1);
    let ng = gi, nk = ki + (up ? -1 : 1);
    if (nk < 0) { if (gi === 0) { kids.splice(ki, 0, item); return; } ng = gi - 1; nk = G[ng].kids.length; }
    else if (nk > kids.length) { if (gi === G.length - 1) { kids.splice(ki, 0, item); return; } ng = gi + 1; nk = 0; }
    G[ng].kids.splice(nk, 0, item);
    S.activeG = ng; S.focusSel = `[data-drag="k"][data-g="${ng}"][data-k="${nk}"]`;
  }
  render();
});

    case "exp-from-job": if (findJob(7)) { openJob(7, "jobs"); S.scrollTo = "#js-duty"; } else S.route = "jobs"; break;

    case "resume-edit": S.route = "resume"; S.resEdit = { key: "careers", data: JSON.parse(JSON.stringify(S.resume.careers)) }; S.scrollTo = "#rc-careers"; break;
    case "docs": S.route = "docs"; break;
    case "dgroup": if (findGroup(1)) { S.dg = { id: 1 }; S.route = "dgroup"; } else S.route = "docs"; break;
    case "doc": if (findGroup(1)) { S.dg = { id: 1 }; S.doc = { type: "career" }; S.docPane = "edit"; S.route = "doc"; } else S.route = "docs"; break;
    case "doc-pdf": if (findGroup(1)) { S.dg = { id: 1 }; S.doc = { type: "career" }; S.route = "doc"; S.modal = { type: "doc-pdf" }; } else S.route = "docs"; break;
    case "dg-new": S.route = "docs"; S.modal = { type: "dg-new" }; S.newDg = { company: "", date: "2026-10-15", jobId: "" }; break;
    case "dgroup-unreviewed": { const g = S.docGroups.find(x => !x.review); if (g) { S.dg = { id: g.id }; S.route = "dgroup"; } else S.route = "docs"; break; }
    case "jobs": S.route = "jobs"; S.jobFilter = "all"; break;
    case "job": if (S.jobs.length) openJob(S.jobs[0].id, "jobs"); else S.route = "jobs"; break;
    case "job-from-app": ensureData(); S.route = "apps"; openDetail(findApp(19) ? 19 : S.data[0].id); break;
    case "job-edit": if (S.jobs.length) { openJob(S.jobs[0].id, "jobs"); editJob(S.jobs[0]); } else S.route = "jobs"; break;
    case "job-new": editJob(null, "jobs"); break;
    case "notfound": S.route = "404"; break;
  }
  app.scrollTop = 0; app.querySelector(".col")?.scrollTo(0, 0);
  render();
}
function syncBar() {
  sel.value = S.screen;
  const sc = SCREENS.find(s => s.id === S.screen);
  document.getElementById("mnote").innerHTML = sc ? `<b>${sc.label}</b> · <code>${esc(sc.path)}</code> · 명세 ${sc.spec} — 확인할 것: ${sc.check}` : "";
  document.querySelectorAll("#viewSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.view));
  document.querySelectorAll("#offSeg button").forEach(b => b.setAttribute("aria-pressed", (b.dataset.off === "show") === S.showOff));
  frame.classList.toggle("mobile", S.view === "mobile");
}
sel.addEventListener("change", () => goScreen(sel.value));
document.getElementById("viewSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { S.view = b.dataset.view; render(); } });
document.getElementById("offSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { S.showOff = b.dataset.off === "show"; render(); } });
document.getElementById("resetBtn").addEventListener("click", () => { const keep = { view: S.view, showOff: S.showOff }; S = { ...freshState(), ...keep }; goScreen("apps"); });

S = freshState();
goScreen("apps");
</script>
