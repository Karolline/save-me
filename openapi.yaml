openapi: 3.1.0
info:
  title: SaveMe API
  version: 0.3.0
  description: |
    The contract between the frontend services layer and the FastAPI backend.
    JSON is camelCase. Dates are `YYYY-MM-DD`, times are ISO 8601 in UTC.

    Every endpoint except `GET /auth/config` and `POST /auth/dev-login` needs a
    session (the `saveme_session` HttpOnly cookie); without one it returns 401.
    Requests other than GET must send `X-Requested-With: SaveMe` (403 otherwise).
    Another user's application, review, question, job analysis or experience is a 404, as if it didn't exist.
servers:
  - url: /api

paths:
  /auth/config:
    get:
      summary: Which login methods the login screen offers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /auth/dev-login:
    post:
      summary: Log in as the single local user (only when DEV_LOGIN is on; never in prod)
      responses:
        "200":
          description: Logged in; sets the session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { description: DEV_LOGIN is off }
  /auth/me:
    get:
      summary: The logged-in user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: No live session }
  /auth/logout:
    post:
      summary: End this session
      responses:
        "204": { description: Logged out; clears the cookie }
  /auth/logout-all:
    post:
      summary: End every session of the user
      responses:
        "204": { description: Logged out everywhere; clears the cookie }
        "401": { description: No live session }

  /applications:
    get:
      summary: The user's applications, oldest first, with stats
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, ing, done], default: all }
          description: "ing: result is ing. done: anything else. Stats and counts ignore it."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationList" }
    post:
      summary: Add an application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "409": { description: The user already has an application to this company on this day }
        "422": { description: Invalid input }
  /applications/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: One application
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "404": { description: Not found (or another user's) }
    put:
      summary: Replace an application's fields and stages (the note is kept)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "404": { description: Not found (or another user's) }
        "409": { description: Another application to this company on this day exists }
        "422": { description: Invalid input }
    delete:
      summary: Delete an application and its stages (its job analysis stays, unlinked)
      responses:
        "204": { description: Deleted }
        "404": { description: Not found (or another user's) }
  /applications/{id}/note:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      summary: Save the notes (느낀점)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "404": { description: Not found (or another user's) }

  /reviews:
    get:
      summary: The user's interview reviews, grouped by company
      description: |
        Company cards newest first (by their latest review), rows inside oldest
        first. A review without interviewedAt sorts as if dated by the day it
        was created (UTC).
      parameters:
        - name: applicationId
          in: query
          required: false
          schema: { type: integer }
          description: Only that application's reviews (oldest first), for the detail panel.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewList" }
        "404": { description: applicationId is not the user's application }
    post:
      summary: Add a review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "404": { description: applicationId is missing or another user's }
        "422": { description: Invalid input (empty round, unknown answer kind, ...) }
  /reviews/favorites:
    get:
      summary: Starred questions, newest review first, then question order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FavoriteQuestion" }
  /reviews/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: One review with its questions and answers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "404": { description: Not found (or another user's) }
    put:
      summary: Replace a review's fields, questions and answers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "404": { description: The review or applicationId is missing or another user's }
        "422": { description: Invalid input }
    delete:
      summary: Delete a review with its questions and answers
      responses:
        "204": { description: Deleted }
        "404": { description: Not found (or another user's) }
  /reviews/{id}/questions/{questionId}/favorite:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: questionId, in: path, required: true, schema: { type: integer } }
    put:
      summary: Star or unstar a question (the review's updatedAt stays)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isFavorite]
              properties:
                isFavorite: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "404": { description: Not found (or another user's) }
  /reviews/{id}/verified:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      summary: Mark a review as checked by a person, or not (its updatedAt stays)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verified]
              properties:
                verified: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "404": { description: Not found (or another user's) }

  /jobs:
    get:
      summary: The user's job posting analyses, most recently analyzed first (ties by id, newest first)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, undecided, applied, skipped], default: all }
          description: Only analyses with this 지원 여부. Counts ignore it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
    post:
      summary: Add an analysis (analyzedAt becomes today in Asia/Seoul)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { description: applicationId is missing or another user's }
        "409": { description: The application is already linked to another analysis }
        "422": { description: Invalid input (empty company, unknown level, ...) }
  /jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: One analysis with its requirements, counts and linked application
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { description: Not found (or another user's) }
    put:
      summary: Replace an analysis (requirements replaced; analyzedAt becomes today in Asia/Seoul)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { description: The analysis or applicationId is missing or another user's }
        "409": { description: The application is already linked to another analysis }
        "422": { description: Invalid input }
    delete:
      summary: Delete an analysis (its linked application stays, unlinked)
      responses:
        "204": { description: Deleted }
        "404": { description: Not found (or another user's) }
  /jobs/{id}/verified:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      summary: Mark an analysis as checked by a person, or not (analyzedAt and updatedAt stay)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verified]
              properties:
                verified: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { description: Not found (or another user's) }

  /experiences:
    get:
      summary: The user's experiences, most recently started first (no start last; ties by id, newest first)
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [all, unv, need], default: all }
          description: all, unv (not verified) or need (with something to 보완). Counts ignore it.
        - name: q
          in: query
          schema: { type: string, default: "" }
          description: Case-insensitive search over name, summary, org, project and tags. Counts ignore it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperienceList" }
    post:
      summary: Add an experience (verified)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExperienceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experience" }
        "404": { description: An interviewReviewId or related experienceId is missing or another user's }
        "422": { description: Invalid input (empty name, bad month, ...) }
  /experiences/links:
    get:
      summary: The user's experiences with a 공고분석 연결 이름 (for linking job evidence tags), by id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, linkKey]
                  properties:
                    id: { type: integer }
                    linkKey: { type: string }
  /experiences/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: One experience with its actions, questions, related experiences and needs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experience" }
        "404": { description: Not found (or another user's) }
    put:
      summary: Replace an experience (child rows replaced; verified becomes true)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExperienceInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experience" }
        "404": { description: The experience, an interviewReviewId or a related experienceId is missing or another user's }
        "422": { description: Invalid input, or the experience is related to itself }
    delete:
      summary: Delete an experience (other experiences' related rows pointing at it go too)
      responses:
        "204": { description: Deleted }
        "404": { description: Not found (or another user's) }
  /experiences/{id}/verified:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      summary: Mark an experience as checked by a person, or not (updatedAt stays)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verified]
              properties:
                verified: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experience" }
        "404": { description: Not found (or another user's) }

components:
  schemas:
    AuthConfig:
      type: object
      required: [devLogin]
      properties:
        devLogin: { type: boolean }
    User:
      type: object
      required: [id, nickname, status, provider]
      properties:
        id: { type: integer }
        nickname: { type: string }
        status: { type: string, enum: [pending, active] }
        provider: { type: string, description: "How this session logged in: dev or kakao" }
    Stage:
      type: object
      required: [kind, name, at]
      properties:
        kind:
          type: integer
          minimum: 1
          maximum: 4
          description: "1 서류, 2 서류 합격·코테·과제, 3 1차 면접, 4 2차 면접 이상"
        name: { type: string }
        at: { type: string, format: date }
    StageInput:
      type: object
      required: [kind, at]
      description: A stage after the documents; the documents stage is appliedAt.
      properties:
        kind: { type: integer, minimum: 2, maximum: 4 }
        name: { type: string, default: "", description: Empty means the kind's label }
        at: { type: string, format: date }
    ApplicationInput:
      type: object
      required: [company, appliedAt]
      properties:
        company: { type: string, description: Trimmed; must not be empty }
        appliedAt: { type: string, format: date, description: The day the documents were submitted }
        sub: { type: string, default: "" }
        jobTitle: { type: string, default: "" }
        jobUrl: { type: string, default: "" }
        stages:
          type: array
          items: { $ref: "#/components/schemas/StageInput" }
          description: Saved by date; stages on the same day keep this order.
        result: { type: string, enum: [ing, fail, etc], default: ing }
        resultText: { type: string, default: "", description: Required when result is etc }
        endAt: { type: [string, "null"], format: date, description: The day the result was announced }
    Application:
      type: object
      required:
        [id, company, sub, appliedAt, jobTitle, jobUrl, stages, result, resultText, endAt, note, depth, period, jobId, jobAnalyzedAt, createdAt, updatedAt]
      properties:
        id: { type: integer }
        company: { type: string }
        sub: { type: string }
        appliedAt: { type: string, format: date }
        jobTitle: { type: string }
        jobUrl: { type: string }
        stages:
          type: array
          items: { $ref: "#/components/schemas/Stage" }
          description: Every stage, starting with 서류 (kind 1) at appliedAt, by date.
        result: { type: string, enum: [ing, fail, etc] }
        resultText: { type: string }
        endAt: { type: [string, "null"], format: date }
        note: { type: string }
        depth: { type: integer, minimum: 1, maximum: 4, description: The furthest stage kind reached }
        period: { type: string, description: 'e.g. "2026-07", "2026-07 ~ 08", "2025-12 ~ 2026-01"' }
        jobId: { type: [integer, "null"], description: The linked job analysis (one per application) }
        jobAnalyzedAt: { type: [string, "null"], format: date, description: The linked analysis's analyzedAt }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApplicationList:
      type: object
      required: [items, stats, counts]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Application" }
        stats:
          type: object
          description: Over all of the user's applications, whatever the status filter.
          required: [all, ing, doc, test, itv, etc]
          properties:
            all: { type: integer }
            ing: { type: integer }
            doc: { type: integer, description: Failed with depth 1 }
            test: { type: integer, description: Failed with depth 2 }
            itv: { type: integer, description: Failed with depth 3 or 4 }
            etc: { type: integer }
        counts:
          type: object
          required: [all, ing, done]
          properties:
            all: { type: integer }
            ing: { type: integer }
            done: { type: integer }
    Answer:
      type: object
      required: [kind, body]
      description: One bubble under a question.
      properties:
        kind:
          type: string
          enum: [follow, interviewer, mine, retry, memo, ai]
          description: "꼬리질문, 면접관, 내 답, 다시 답한다면, 메모, AI 첨언"
        body: { type: string }
    QuestionInput:
      type: object
      properties:
        question: { type: string, default: "", description: May be empty }
        isFavorite: { type: boolean, default: false }
        answers:
          type: array
          items: { $ref: "#/components/schemas/Answer" }
    ReviewInput:
      type: object
      required: [applicationId, round]
      description: Saving replaces all questions and answers (stars as given).
      properties:
        applicationId: { type: integer }
        round: { type: string, description: Trimmed; must not be empty }
        extra: { type: string, default: "" }
        interviewedAt: { type: [string, "null"], format: date }
        summary: { type: string, default: "", description: 개요 }
        questions:
          type: array
          items: { $ref: "#/components/schemas/QuestionInput" }
    Question:
      type: object
      required: [id, question, isFavorite, answers]
      properties:
        id: { type: integer }
        question: { type: string }
        isFavorite: { type: boolean }
        answers:
          type: array
          items: { $ref: "#/components/schemas/Answer" }
    ReviewSummary:
      type: object
      required:
        [id, applicationId, company, sub, appliedAt, round, extra, interviewedAt, questionCount, favoriteCount, verified, createdAt]
      properties:
        id: { type: integer }
        applicationId: { type: integer }
        company: { type: string }
        sub: { type: string }
        appliedAt: { type: string, format: date }
        round: { type: string }
        extra: { type: string }
        interviewedAt: { type: [string, "null"], format: date }
        questionCount: { type: integer }
        favoriteCount: { type: integer }
        verified:
          type: boolean
          description: A person read and checked it. Saving in the app sets it; imported AI write-ups may start unchecked.
        createdAt: { type: string, format: date-time }
    Review:
      allOf:
        - $ref: "#/components/schemas/ReviewSummary"
        - type: object
          required: [summary, questions, updatedAt]
          properties:
            summary: { type: string, description: 개요 }
            questions:
              type: array
              items: { $ref: "#/components/schemas/Question" }
            updatedAt: { type: string, format: date-time }
    ReviewList:
      type: object
      required: [groups, total, favoriteCount]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [company, latest, multipleApplications, reviews]
            properties:
              company: { type: string }
              latest: { type: string, format: date, description: "The latest review's day (interviewedAt, else the creation day)" }
              multipleApplications: { type: boolean, description: The company's reviews span more than one application }
              reviews:
                type: array
                items: { $ref: "#/components/schemas/ReviewSummary" }
        total: { type: integer }
        favoriteCount: { type: integer }
    FavoriteQuestion:
      allOf:
        - $ref: "#/components/schemas/Question"
        - type: object
          required: [reviewId, applicationId, company, sub, round, extra, interviewedAt]
          properties:
            reviewId: { type: integer }
            applicationId: { type: integer }
            company: { type: string }
            sub: { type: string }
            round: { type: string }
            extra: { type: string }
            interviewedAt: { type: [string, "null"], format: date }
    Requirement:
      type: object
      required: [category, text]
      description: One sentence of the posting (주요업무 · 자격요건 · 우대사항) and how well I cover it.
      properties:
        category: { type: string, enum: [duty, must, pref], description: "주요업무, 자격요건, 우대사항" }
        text: { type: string, description: 공고 원문 }
        level:
          type: string
          enum: [full, part, none, ""]
          default: ""
          description: '충족, 부분·인접, 없음, "" = 미평가 (not rated yet; not counted as full/part/none)'
        description: { type: string, default: "" }
        evidence: { type: array, items: { type: string }, description: 근거 경험 tags }
        noEvidence: { type: string, default: "", description: 근거 없음 (shown red) }
        caution: { type: string, default: "", description: 주의 (shown ochre) }
    JobFields:
      type: object
      required: [company]
      description: The fields a user edits. Lists and tables are stored as JSON inside the analysis.
      properties:
        company: { type: string, description: Trimmed; must not be empty }
        team: { type: string, default: "" }
        title: { type: string, default: "", description: 직무 (공고 제목) }
        url: { type: string, default: "" }
        deadline: { type: [string, "null"], format: date }
        status: { type: string, enum: [undecided, applied, skipped], default: undecided, description: 지원 여부 }
        fit: { type: string, enum: ["상", "중", "하", ""], default: "", description: 기술 핏 }
        conclusion: { type: string, default: "", description: 한 줄 결론 }
        cultureGrade: { type: string, enum: [Green, Yellow, Red, ""], default: "" }
        cultureScore: { type: [integer, "null"], minimum: 0, maximum: 1000, description: 성향 적합도 total (out of 100) }
        cultureType: { type: string, default: "", description: 실제 역할 유형 }
        culturePoints: { type: string, default: "", description: 잘 맞는 점 }
        cultureReadBetween: { type: string, default: "", description: 공고 행간 읽기 }
        notes: { type: string, default: "", description: 기타 메모 (what fits no other section) }
        rawText: { type: string, default: "", description: 공고 원문, pasted as is }
        conditions:
          type: array
          description: 지원 조건
          items:
            type: object
            properties:
              label: { type: string }
              state: { type: string, enum: [ok, check, no], description: "충족, 확인 필요, 안 맞음" }
              text: { type: string, description: 내 상황 }
        fitNotes: { type: array, items: { type: string }, description: 핏 평가, one paragraph each }
        cultureItems:
          type: array
          description: 성향 적합도 score table
          items:
            type: object
            properties:
              name: { type: string }
              score: { type: [integer, "null"], minimum: 0, maximum: 1000 }
              max: { type: [integer, "null"], minimum: 0, maximum: 1000 }
              quote: { type: string }
        cultureRisks: { type: array, items: { type: string }, description: Risk · Red Flag 체크 }
        highlight:
          type: array
          description: 부각할 경험, first is rank 1
          items:
            type: object
            properties:
              exp: { type: string }
              maps: { type: string }
              why: { type: string }
        excluded:
          type: array
          description: 서류에서 뺀 경험과 쓸 곳
          items:
            type: object
            properties:
              exp: { type: string }
              where: { type: string }
        questions:
          type: array
          description: 약한 부분 · 면접 예상 질문
          items:
            type: object
            properties:
              question: { type: string }
              answer: { type: string }
        toWrite: { type: array, items: { type: string }, description: 작성 권장 }
        gaps: { type: array, items: { type: string }, description: 갭 }
        expSuggestions: { type: array, items: { type: string }, description: 경험 보완 제안 }
        askBack: { type: array, items: { type: string }, description: 면접 역질문 }
        checks: { type: array, items: { type: string }, description: 확인 필요 }
        requirements:
          type: array
          items: { $ref: "#/components/schemas/Requirement" }
          description: Kept in this order; saving replaces them all.
    JobInput:
      allOf:
        - $ref: "#/components/schemas/JobFields"
        - type: object
          properties:
            applicationId:
              type: [integer, "null"]
              description: Link to this application (one analysis per application). When set, status is stored as applied whatever was sent.
    LevelCounts:
      type: object
      required: [full, part, none, unrated, total]
      properties:
        full: { type: integer }
        part: { type: integer }
        none: { type: integer }
        unrated: { type: integer, description: 'Requirements with level ""' }
        total: { type: integer, description: Every requirement of the category, unrated included }
    JobSummary:
      type: object
      required:
        [id, company, team, title, analyzedAt, status, fit, cultureGrade, cultureScore, mustFull, mustTotal, noEvidenceCount, applicationId]
      properties:
        id: { type: integer }
        company: { type: string }
        team: { type: string }
        title: { type: string }
        analyzedAt: { type: string, format: date }
        status: { type: string, enum: [undecided, applied, skipped] }
        fit: { type: string, enum: ["상", "중", "하", ""] }
        cultureGrade: { type: string, enum: [Green, Yellow, Red, ""] }
        cultureScore: { type: [integer, "null"] }
        mustFull: { type: integer, description: 자격요건 with level full }
        mustTotal: { type: integer, description: Every 자격요건, unrated included }
        noEvidenceCount: { type: integer, description: Requirements with level none (unrated not counted) }
        applicationId: { type: [integer, "null"] }
    Job:
      allOf:
        - $ref: "#/components/schemas/JobFields"
        - type: object
          required: [id, analyzedAt, verified, applicationId, application, counts, noEvidenceCount, createdAt, updatedAt]
          properties:
            id: { type: integer }
            analyzedAt: { type: string, format: date, description: Today in Asia/Seoul on every save }
            verified: { type: boolean, description: "사람 확인: false for imported analyses, true once created or saved on screen (POST/PUT) or marked with PUT /jobs/{id}/verified" }
            applicationId: { type: [integer, "null"] }
            application:
              description: The linked application, or null
              oneOf:
                - type: "null"
                - type: object
                  required: [id, company, sub, appliedAt, result, resultText]
                  properties:
                    id: { type: integer }
                    company: { type: string }
                    sub: { type: string }
                    appliedAt: { type: string, format: date }
                    result: { type: string, enum: [ing, fail, etc] }
                    resultText: { type: string }
            counts:
              type: object
              required: [duty, must, pref]
              description: ●◐○ counts per category; must is the 기술 핏 card's "자격요건 n개 중 …"
              properties:
                duty: { $ref: "#/components/schemas/LevelCounts" }
                must: { $ref: "#/components/schemas/LevelCounts" }
                pref: { $ref: "#/components/schemas/LevelCounts" }
            noEvidenceCount: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    JobList:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JobSummary" }
        counts:
          type: object
          description: Over all of the user's analyses, whatever the status filter.
          required: [all, undecided, applied, skipped]
          properties:
            all: { type: integer }
            undecided: { type: integer }
            applied: { type: integer }
            skipped: { type: integer }
    Month:
      type: [string, "null"]
      pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
      description: "YYYY-MM, or null when unknown. An empty string is read as null."
    ExperienceAction:
      type: object
      properties:
        title: { type: string, default: "" }
        points: { type: array, items: { type: string }, default: [] }
        note: { type: string, default: "", description: 회고 · 메모 }
        source: { type: string, default: "", description: 출처 }
    ExperienceAsked:
      type: object
      required: [question]
      properties:
        question: { type: string }
        where: { type: string, default: "", description: 어디서 }
        interviewReviewId:
          type: [integer, "null"]
          description: The user's interview review this question came from; null again when that review is deleted
    ExperienceQa:
      type: object
      required: [question]
      properties:
        question: { type: string }
        answer: { type: string, default: "", description: Empty means "답변 작성 필요" }
        caution: { type: string, default: "" }
    ExperienceNeed:
      type: object
      required: [label, detail]
      description: One 보완할 것, computed by the server (결과 수치 없음, 비어 있음 n, 답변 작성 필요 n, 보완 필요 n)
      properties:
        label: { type: string }
        detail: { type: string }
    ExperienceFields:
      type: object
      required: [name]
      properties:
        name: { type: string, description: Required, trimmed }
        project: { type: string, default: "" }
        linkKey: { type: string, default: "", description: 공고분석 연결 이름 (an evidence tag containing it links here) }
        startedOn: { $ref: "#/components/schemas/Month" }
        endedOn: { $ref: "#/components/schemas/Month", description: null means 진행 중 }
        org: { type: string, default: "" }
        role: { type: string, default: "" }
        tags: { type: array, items: { type: string }, default: [] }
        summary: { type: string, default: "" }
        situation: { type: string, default: "" }
        scope: { type: string, default: "", description: 본인 담당 범위 }
        task: { type: string, default: "" }
        actionsIntro: { type: string, default: "" }
        actions: { type: array, items: { $ref: "#/components/schemas/ExperienceAction" }, default: [] }
        resultMine: { type: array, items: { type: string }, default: [] }
        resultTeam: { type: array, items: { type: string }, default: [] }
        numbers: { type: string, default: "", description: Empty means "결과 수치 없음" }
        appealMainUse: { type: string, default: "" }
        appealQuestions: { type: array, items: { type: string }, default: [] }
        appealStrength: { type: string, default: "" }
        framing: { type: array, items: { type: string }, default: [] }
        asked: { type: array, items: { $ref: "#/components/schemas/ExperienceAsked" }, default: [] }
        qas: { type: array, items: { $ref: "#/components/schemas/ExperienceQa" }, default: [] }
        missing: { type: array, items: { type: string }, default: [], description: 보완 필요 }
    ExperienceInput:
      allOf:
        - $ref: "#/components/schemas/ExperienceFields"
        - type: object
          properties:
            related:
              type: array
              default: []
              description: The user's other experiences (not this one). Saving replaces actions, asked, qas and related.
              items:
                type: object
                required: [experienceId]
                properties:
                  experienceId: { type: integer }
                  note: { type: string, default: "", description: 어떻게 이어지나 }
    ExperienceSummary:
      type: object
      required: [id, name, summary, project, org, startedOn, endedOn, verified, needs]
      properties:
        id: { type: integer }
        name: { type: string }
        summary: { type: string }
        project: { type: string }
        org: { type: string }
        startedOn: { $ref: "#/components/schemas/Month" }
        endedOn: { $ref: "#/components/schemas/Month" }
        verified: { type: boolean }
        needs: { type: array, items: { $ref: "#/components/schemas/ExperienceNeed" } }
    Experience:
      allOf:
        - $ref: "#/components/schemas/ExperienceFields"
        - type: object
          required: [id, verified, related, needs, createdAt, updatedAt]
          properties:
            id: { type: integer }
            verified: { type: boolean, description: "false for imported experiences, true once created or saved on screen or marked with PUT /experiences/{id}/verified" }
            related:
              type: array
              items:
                type: object
                required: [experienceId, note, name, startedOn, endedOn, verified]
                properties:
                  experienceId: { type: integer }
                  note: { type: string }
                  name: { type: string }
                  startedOn: { $ref: "#/components/schemas/Month" }
                  endedOn: { $ref: "#/components/schemas/Month" }
                  verified: { type: boolean }
            needs: { type: array, items: { $ref: "#/components/schemas/ExperienceNeed" } }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ExperienceList:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ExperienceSummary" }
        counts:
          type: object
          description: Over all of the user's experiences, whatever the view and the search.
          required: [all, unv, need]
          properties:
            all: { type: integer }
            unv: { type: integer, description: Not verified }
            need: { type: integer, description: With at least one 보완할 것 }
