[project]
name = "saveme-backend"
version = "0.8.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# 지원서류 PDF (지금은 쓰지 않는다, docs/pdf.md): uv sync --extra pdf
pdf = ["playwright>=1.64.0"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# tests/compose needs Docker and is slow; run it explicitly.
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
# pdf 표시가 붙은 테스트(지원서류 PDF)는 기본 실행에서 뺀다: uv run pytest -m pdf
addopts = "-m 'not pdf'"
markers = ["pdf: 지원서류 PDF (지금은 쓰지 않음, docs/pdf.md). 기본 실행에서 빠진다"]
